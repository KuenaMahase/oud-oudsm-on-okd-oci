---
apiVersion: v1
kind: Pod
metadata:
  name: nfs-test-pod
  namespace: storage-validation
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: registry.access.redhat.com/ubi9/ubi-minimal
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -eu
          printf '%s\n' hello-from-nfs > /data/hello
          cat /data/hello
          sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nfs-test-pvc
